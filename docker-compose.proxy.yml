# Overlay for horizontal scaling behind an nginx load balancer.
#
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --scale web=3
#
# The base `web` port mapping is reset so multiple replicas can coexist, and
# nginx publishes the single external port instead.

services:
  web:
    ports: !reset []
    expose:
      - "3000"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
