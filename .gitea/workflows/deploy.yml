name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint & typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
        continue-on-error: true

  deploy:
    needs: test
    runs-on: homacom-production

    steps:
      - name: Login to Gitea registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | \
            docker login git.homapanel.ir \
            -u "${{ secrets.REGISTRY_USERNAME }}" \
            --password-stdin

      - name: Pull latest production image
        run: |
          set -euo pipefail
          docker pull git.homapanel.ir/admin/front:latest

      - name: Deploy production container
        run: |
          set -euo pipefail
          docker compose \
            -f /opt/apps/homacom/docker-compose.yml \
            pull
          docker compose \
            -f /opt/apps/homacom/docker-compose.yml \
            up -d \
            --force-recreate

      - name: Show boot logs
        run: |
          set -euo pipefail
          sleep 3
          docker logs --tail 100 homacom-front 2>&1 | tee /tmp/homacom-boot.log

      - name: Show container status
        run: |
          docker ps --filter name=homacom-front

      - name: Health check
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS http://127.0.0.1:3001/