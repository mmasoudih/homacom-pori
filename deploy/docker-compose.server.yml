# Production compose for the deploy runner host.
#
# Copy this file to the server once:
#   sudo mkdir -p /opt/apps/homacom
#   sudo cp deploy/docker-compose.server.yml /opt/apps/homacom/docker-compose.yml
#   sudo cp deploy/.env.example /opt/apps/homacom/.env   # then edit values
#
# The image is built by `.gitea/workflows/deploy.yml` on the homacom-production
# runner as `homacom-pori:prod`; this file only runs it (no `build:` section).

name: homacom-pori

services:
  web:
    image: homacom-pori:prod
    container_name: homacom-pori-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://ahoma.ir/api}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=384}
    ports:
      - "${APP_PORT:-4500}:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
